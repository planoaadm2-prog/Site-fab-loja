services:
  - type: web
    name: virtuosa-beach
    runtime: node
    plan: starter
    buildCommand: npm ci --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: virtuosa-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_PATH
        value: /var/data/virtuosa.sqlite
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: MP_COLLECTOR_ID
        sync: false
